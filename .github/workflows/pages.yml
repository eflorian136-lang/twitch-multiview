name: Website testen und veroeffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Twitch Client-ID eintragen (optional, aus Repo-Variable)
        if: vars.TWITCH_CLIENT_ID != ''
        run: sed -i "s/TWITCH_CLIENT_ID = ''/TWITCH_CLIENT_ID = '${{ vars.TWITCH_CLIENT_ID }}'/" js/config.js
      - name: Seite zusammenstellen
        run: mkdir _site && cp -r index.html css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
