name: Fire-TV-App bauen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Signierschluessel laden (falls als Secret hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64 Secret: APK wird mit Debug-Schluessel signiert (Updates brauchen dann Deinstallation)."
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease \
            -PstartUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          cp android/app/build/outputs/apk/release/app-release.apk MultiView.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiView-apk
          path: MultiView.apk

      - name: Als Download veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app
          name: Fire-TV-App
          body: |
            Fire-TV-App (Build ${{ github.run_number }}).
            Download-Link fuer die Downloader-App:
            https://github.com/${{ github.repository }}/releases/download/tv-app/MultiView.apk
          files: MultiView.apk
          make_latest: true
