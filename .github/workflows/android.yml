name: Fire-TV-App bauen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Signierschluessel laden (falls als Secret hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64 Secret: APK wird mit Debug-Schluessel signiert, Auto-Update ist aus."
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: multiview
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease \
            -PstartUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          cp android/app/build/outputs/apk/release/app-release.apk MultiView.apk
          files="MultiView.apk"
          # version.json tells installed apps that an update exists (only for stable-signed builds)
          if [ "$SIGNED" = "1" ]; then
            printf '{"versionCode": %s, "apk": "https://github.com/%s/releases/download/tv-app/MultiView.apk"}\n' \
              "$VERSION_CODE" "${{ github.repository }}" > version.json
            files="$files
          version.json"
          fi
          { echo "RELEASE_FILES<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiView-apk
          path: MultiView.apk

      - name: Als Download veroeffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app
          name: Fire-TV-App
          body: |
            Fire-TV-App (Build ${{ github.run_number }}).
            Download-Link fuer die Downloader-App:
            https://github.com/${{ github.repository }}/releases/download/tv-app/MultiView.apk
          files: ${{ env.RELEASE_FILES }}
          make_latest: true
