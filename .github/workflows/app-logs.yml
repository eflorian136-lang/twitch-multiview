name: App-Log abholen

# Die App schickt ihr Log an ntfy.sh (js/logger.js). ntfy.sh hebt Nachrichten nur 12 Stunden auf,
# darum holt dieser Workflow sie regelmaessig ab und legt sie im Branch "app-logs" ab:
# logs/JJJJ-MM-TT.log (alles) und logs/fehler.log (nur Fehler, Abstuerze, Stream-Startfehler).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # neue Fehler landen im Issue "App-Fehler" (Label app-fehler), das Claude abarbeitet

concurrency:
  group: app-logs
  cancel-in-progress: false

env:
  TOPIC: mv-applog-yk23bxfv09r4mzq1

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch app-logs vorbereiten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin app-logs >/dev/null; then
            git fetch origin app-logs
            git checkout -B app-logs origin/app-logs
          else
            git checkout --orphan app-logs
            git rm -rfq .
            printf '# App-Log\n\nAutomatisch gesammelt von .github/workflows/app-logs.yml.\nlogs/fehler.log = nur Fehler, logs/JJJJ-MM-TT.log = alles.\n' > README.md
          fi
          mkdir -p logs
      - name: Neue Meldungen von ntfy.sh holen
        run: |
          since=$(cat logs/.last-id 2>/dev/null || echo 12h)
          curl -fsS --max-time 60 "https://ntfy.sh/$TOPIC/json?poll=1&since=$since" > "$RUNNER_TEMP/new.jsonl" || {
            # gespeicherte ID zu alt (nicht mehr bei ntfy): alles der letzten 12 Stunden
            curl -fsS --max-time 60 "https://ntfy.sh/$TOPIC/json?poll=1&since=12h" > "$RUNNER_TEMP/new.jsonl"
          }
          python3 - "$RUNNER_TEMP/new.jsonl" <<'PY'
          import json, sys, time, os, re
          msgs = []
          for line in open(sys.argv[1], encoding='utf-8'):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get('event') == 'message' and isinstance(m.get('message'), str):
                  msgs.append(m)
          msgs = msgs[-2000:]
          if not msgs:
              print('Keine neuen Meldungen')
              sys.exit(0)
          bad = (' ERROR ', ' CRASH ', ' STREAM ', ' WARN ')
          for m in msgs:
              t = time.gmtime(m.get('time', time.time()))
              stamp = time.strftime('%Y-%m-%d %H:%M:%S UTC', t)
              text = m['message'][:5000]
              with open(f"logs/{time.strftime('%Y-%m-%d', t)}.log", 'a', encoding='utf-8') as f:
                  f.write(f"\n=== {stamp} ===\n{text}\n")
              lines = text.split('\n')
              # ein Eintrag beginnt mit "HH:MM:SS.mmm TYP"; Folgezeilen (Stacktrace, Diagnose) gehoeren dazu
              err, keep = [], False
              for l in lines[1:]:
                  if re.match(r'^\d\d:\d\d:\d\d\.\d{3} [A-Z]+ ', l):
                      keep = any(b in l for b in bad)
                  if keep:
                      err.append(l)
              if err:
                  block = f"\n=== {stamp} {lines[0]}\n" + '\n'.join(err) + '\n'
                  with open('logs/fehler.log', 'a', encoding='utf-8') as f:
                      f.write(block)
                  with open(os.environ['RUNNER_TEMP'] + '/new-errors.txt', 'a', encoding='utf-8') as f:
                      f.write(block)
          with open('logs/.last-id', 'w') as f:
              f.write(msgs[-1]['id'])
          print(f'{len(msgs)} neue Meldungen')
          PY
      - name: Speichern
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "App-Log $(date -u '+%Y-%m-%d %H:%M')"
          git push origin app-logs
      - name: Neue Fehler ins Issue "App-Fehler"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f="$RUNNER_TEMP/new-errors.txt"
          [ -s "$f" ] || { echo "Keine neuen Fehler"; exit 0; }
          gh label create app-fehler --color B60205 --description "Automatisch gemeldete App-Fehler" --force >/dev/null
          { echo '```'; head -c 60000 "$f"; echo; echo '```'; } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --label app-fehler --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "App-Fehler" --label app-fehler --body-file "$RUNNER_TEMP/body.md"
          fi
